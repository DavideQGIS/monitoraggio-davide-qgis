name: Qualita codice

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installa strumenti
        run: python -m pip install --upgrade pytest ruff
      - name: Controlla sintassi
        run: python -m compileall -q Monitoraggio_Davide
      - name: Esegui test
        run: python -m unittest discover -s tests -v
      - name: Controlli statici essenziali
        run: python -m ruff check Monitoraggio_Davide tests --select=E9,F63,F7,F82
